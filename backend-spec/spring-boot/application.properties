# FoodShare Spring Boot Configuration
server.port=8080

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/foodshare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Firebase Cloud Messaging (FCM) Notifications
firebase.credentials.path=classpath:firebase-service-account.json
firebase.project-id=foodshare-app

# Google Maps API Key
google.maps.api-key=YOUR_GOOGLE_MAPS_API_KEY
